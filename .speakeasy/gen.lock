examples:
  CreateAgent:
    speakeasy-default-create-agent:
      parameters:
        path:
          api_version: "<value>"
      requestBody:
        application/json: {"base_environment": {"sources": [{"content": "You are a data analyst. Always include visualizations and export results as PDF.", "target": ".agents/AGENTS.md", "type": "inline"}, {"content": "---\nname: slide-maker\ndescription: Create HTML slide decks\n---\n# Slide Maker\n\nWhen asked to create a presentation:\n1. Analyze the input data\n2. Create an HTML slide deck with reveal.js\n3. Save to /workspace/output/slides.html", "target": ".agents/skills/slide-maker/SKILL.md", "type": "inline"}], "type": "remote"}}
      responses:
        default:
          application/json: {"base_environment": {"sources": [{"content": "You are a data analyst. Always include visualizations and export results as PDF.", "target": ".agents/AGENTS.md", "type": "inline"}, {"content": "---\nname: slide-maker\ndescription: Create HTML slide decks\n---\n# Slide Maker\n\nWhen asked to create a presentation:\n1. Analyze the input data\n2. Create an HTML slide deck with reveal.js\n3. Save to /workspace/output/slides.html", "target": ".agents/skills/slide-maker/SKILL.md", "type": "inline"}], "type": "remote"}}
    create:
      parameters:
        path:
