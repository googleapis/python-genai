
name: Import Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SPEAKEASY_VERSION: v2.956.0

jobs:
  test-import:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Cache Speakeasy Generator
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: ~/go/bin/generate
          key: speakeasy-generator-${{ env.SPEAKEASY_VERSION }}

      - name: Install Speakeasy Generator
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ env.SPEAKEASY_VERSION }}" https://github.com/speakeasy-api/openapi-generation.git /tmp/openapi-generation
          cd /tmp/openapi-generation
          go install ./cmd/generate
          rm -rf /tmp/openapi-generation

      - name: Generate GAOS SDK
        env:
          SPEAKEASY_LICENSE_TOKEN: ${{ secrets.SPEAKEASY_LICENSE_TOKEN }}
        run: |
          ./scripts/generate_gaos.sh

      - name: Assert no diff in GAOS SDK
        run: |
          git diff --exit-code google/genai/_gaos/

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
          pip install pytest
          pip install .

      - name: Run import test
        run: |
          pytest google/genai/tests/imports/test_no_optional_imports.py