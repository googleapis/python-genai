# Commits the GAOS SDK generated by a successful `Tests` run on main back to
# main, since google/genai/_gaos/ is not exported from Piper.
#
# This reuses the `gaos-sdk` artifact from that run instead of generating the
# SDK a second time, and only runs after its tests pass.
name: Sync GAOS SDK on Main

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

jobs:
  commit:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Replace GAOS SDK with the generated one
        run: rm -rf google/genai/_gaos

      - name: Download GAOS SDK from the Tests run
        uses: actions/download-artifact@v4
        with:
          name: gaos-sdk
          path: google/genai/_gaos
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push changes if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A google/genai/_gaos/
          if git diff --staged --quiet; then
            echo "No changes to commit. GAOS SDK is up to date."
            exit 0
          fi
          git commit -m "chore: regenerate GAOS SDK [skip ci]"
          # Fast-forward only. If main has moved on, its own Tests run will
          # trigger a newer sync, so skip rather than push a stale SDK.
          if ! git push origin HEAD:main; then
            echo "main moved past ${{ github.event.workflow_run.head_sha }}; skipping."
          fi
