# This workflow runs mypy for static type checking.
# See https://mypy.readthedocs.io/en/stable/index.html for more information.
#
# You can adjust the behavior by modifying this file.
name: Run mypy

on:
  pull_request:
    branches:
      - main
permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev
          pip install -r requirements.txt

      - name: Run mypy  ${{ matrix.python-version }}
        run: mypy google/genai/
